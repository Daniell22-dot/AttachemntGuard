schema_version: 1

max_file_size_mb: 25
max_archive_depth: 2
max_archive_entries: 1000
max_compression_ratio: 100

allowed_extensions:
  - .pdf
  - .png
  - .jpg
  - .jpeg
  - .txt
  - .csv
  - .docx
  - .xlsx

blocked_extensions:
  - .exe
  - .scr
  - .msi
  - .bat
  - .cmd
  - .ps1
  - .vbs
  - .js
  - .jar
  - .hta
  - .lnk

quarantine_if:
  - extension_mismatch
  - double_extension
  - archive_contains_executable
  - archive_contains_script
  - nested_archive
  - excessive_compression_ratio
  - excessive_archive_entries
  - yara_match
  - known_malicious_hash
  - reputation_suspicious

block_if:
  - executable_file_type
  - script_file_type
  - known_malicious_hash

deobfuscation:
  enabled: true
  min_entropy_sample_bytes: 256
  entropy_warn_threshold: 7.2
  entropy_quarantine_threshold: 7.75
  skip_entropy_for_containers: true
  entropy_exempt_formats:
    - zip_or_ooxml
    - gzip
    - bzip2
    - xz
    - zstd
    - 7zip
    - rar
    - pdf
    - png
    - jpeg
    - gif
  max_decoded_segments: 32
  max_member_bytes: 2097152
  max_total_uncompressed: 16777216
  max_members: 100
