name: Build and publish releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Run tests
        run: python -m pytest -q

      - name: Build GUI executable
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          python -m PyInstaller `
            --noconfirm --clean --onedir --windowed `
            --name AttachmentGuard `
            --distpath "$root\dist\release" `
            --workpath "$root\build\gui" `
            --specpath "$root\build\specs" `
            --add-data "$root\policy;policy" `
            --add-data "$root\rules;rules" `
            --add-data "$root\config.ini.example;." `
            --collect-all yara `
            "$root\main.py"

      - name: Build CLI executable
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          python -m PyInstaller `
            --noconfirm --clean --onefile --console `
            --name AttachmentGuardCLI `
            --distpath "$root\dist\release\AttachmentGuard" `
            --workpath "$root\build\cli" `
            --specpath "$root\build\specs" `
            --add-data "$root\policy;policy" `
            --add-data "$root\rules;rules" `
            --add-data "$root\config.ini.example;." `
            --hidden-import=yara `
            "$root\cli.py"

      - name: Add release documents
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          Copy-Item -LiteralPath "$root\README.md" -Destination "$root\dist\release\AttachmentGuard\README.md" -Force
          Copy-Item -LiteralPath "$root\LICENSE" -Destination "$root\dist\release\AttachmentGuard\LICENSE" -Force
          Copy-Item -LiteralPath "$root\config.ini.example" -Destination "$root\dist\release\AttachmentGuard\config.ini.example" -Force

      - name: Create release ZIP
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $zip = "$root\dist\AttachmentGuard-$env:GITHUB_REF_NAME-windows.zip"
          Compress-Archive -Path "$root\dist\release\AttachmentGuard\*" -DestinationPath $zip -Force
          "Created $zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttachmentGuard-${{ github.ref_name }}-windows
          path: dist/AttachmentGuard-*-windows.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $root = $env:GITHUB_WORKSPACE
          $tag = $env:GITHUB_REF_NAME
          $zip = "$root\dist\AttachmentGuard-$tag-windows.zip"
          gh release create $tag $zip --title $tag --generate-notes
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
